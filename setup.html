<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer le coffre — outil d'installation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="card" style="max-width:460px; text-align:left;">
    <p class="eyebrow">Installation — étape unique</p>
    <h1 style="text-align:center; margin-bottom:6px;">Créer le coffre de données</h1>
    <p class="hint" style="text-align:center; margin-bottom:22px;">
      Cet outil crée le "bin" à ta place, pas besoin de chercher un bouton dans le tableau de bord de jsonbin.io.
    </p>

    <label style="font-size:13px; color:var(--ink-dim); display:block; margin-bottom:6px;">Ta Master Key (jsonbin.io → API Keys)</label>
    <input type="text" id="master-key" class="word-input" style="width:100%; margin-bottom:14px;" placeholder="$2a$10$....">

    <button class="btn primary" id="create-btn" style="width:100%;">Créer le coffre</button>

    <p class="error" id="setup-error"></p>

    <div id="result" class="hidden" style="margin-top:20px; padding:16px; background:var(--bg-deep); border:1px solid var(--surface-line); border-radius:12px;">
      <p style="font-size:13px; color:var(--ink-dim); margin:0 0 6px;">Ton Bin ID (à coller dans config.js) :</p>
      <p id="bin-id" style="font-family:'Fraunces', serif; font-size:18px; color:var(--gold-bright); word-break:break-all; margin:0 0 12px;"></p>
      <button class="btn ghost" id="copy-btn">Copier le Bin ID</button>
    </div>
  </div>
</div>

<script>
document.getElementById("create-btn").addEventListener("click", async () => {
  const key = document.getElementById("master-key").value.trim();
  const errorEl = document.getElementById("setup-error");
  const resultEl = document.getElementById("result");
  errorEl.textContent = "";
  resultEl.classList.add("hidden");

  if (!key) {
    errorEl.textContent = "Colle d'abord ta Master Key.";
    return;
  }

  const btn = document.getElementById("create-btn");
  btn.disabled = true;
  btn.textContent = "Création en cours...";

  try {
    const res = await fetch("https://api.jsonbin.io/v3/b", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": key,
        "X-Bin-Name": "coffre-a-mots",
        "X-Bin-Private": "false",
      },
      body: JSON.stringify({
        j1: { words: [] },
        j2: { words: [] },
      }),
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error("Statut " + res.status + " — " + text);
    }

    const data = await res.json();
    const binId = data.metadata && data.metadata.id;
    if (!binId) throw new Error("Réponse inattendue du serveur.");

    document.getElementById("bin-id").textContent = binId;
    resultEl.classList.remove("hidden");
  } catch (err) {
    errorEl.textContent = "Échec de la création. Vérifie que la Master Key est bien copiée en entier. Détail : " + err.message;
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Créer le coffre";
  }
});

document.getElementById("copy-btn").addEventListener("click", () => {
  const binId = document.getElementById("bin-id").textContent;
  navigator.clipboard.writeText(binId).then(() => {
    const btn = document.getElementById("copy-btn");
    const original = btn.textContent;
    btn.textContent = "Copié ✓";
    setTimeout(() => (btn.textContent = original), 1500);
  });
});
</script>
</body>
</html>
